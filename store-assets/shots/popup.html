<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Zinra store shot · popup</title>
  <link rel="stylesheet" href="../../ui.css" />
  <style>
    html, body {
      margin: 0;
      width: 1280px;
      height: 800px;
      overflow: hidden;
      background: #1a1916;
    }
    .browser {
      width: 1280px;
      height: 800px;
      display: grid;
      grid-template-rows: 44px 1fr;
      background: #1a1916;
    }
    .chrome {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 14px 0 16px;
      background: #23211d;
      border-bottom: 1px solid rgba(243, 239, 230, 0.08);
    }
    .dots { display: flex; gap: 6px; }
    .dots i {
      width: 10px; height: 10px; border-radius: 50%;
      background: #3a3732; display: block;
    }
    .tab {
      display: flex; align-items: center; gap: 8px;
      height: 28px; padding: 0 12px;
      background: #2c2a25; border-radius: 8px;
      color: #f3efe6; font: 600 12px/1 Inter, "Segoe UI", sans-serif;
    }
    .tab img { width: 14px; height: 14px; border-radius: 3px; }
    .omnibox {
      flex: 1; height: 26px; border-radius: 8px;
      background: #1a1916; color: #9a9386;
      display: flex; align-items: center; padding: 0 12px;
      font: 12px/1 Inter, "Segoe UI", sans-serif;
    }
    .ext {
      width: 32px; height: 28px; border-radius: 8px;
      background: rgba(224, 180, 74, 0.16);
      border: 1px solid rgba(224, 180, 74, 0.45);
      display: grid; place-items: center;
    }
    .ext img { width: 18px; height: 18px; }
    .page {
      position: relative;
      overflow: hidden;
      background: #ece7dc;
    }
    .page img {
      width: 100%; height: 100%;
      object-fit: cover; object-position: top center;
      display: block;
    }
    .popup-wrap {
      position: absolute;
      top: 10px;
      right: 18px;
      width: 360px;
      zoom: 0.84;
      background: #1a1916;
      border-radius: 14px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(243, 239, 230, 0.08);
      overflow: hidden;
    }
  </style>
</head>
<body>
  <div class="browser">
    <div class="chrome">
      <div class="dots"><i></i><i></i><i></i></div>
      <div class="tab">
        <img src="../../icons/icon16.png" alt="" />
        Northlane · Team
      </div>
      <div class="omnibox">northlane.app/team</div>
      <div class="ext" title="Zinra">
        <img src="../../icons/icon32.png" alt="" />
      </div>
    </div>
    <div class="page">
      <img src="backdrop-page.jpg" alt="" />
      <aside class="popup-wrap">
        <div class="popup-body" style="width:360px;padding:16px;">
          <header class="brand-head">
            <div class="brand">
              <img class="brand-mark" src="../../icons/icon48.png" width="28" height="28" alt="" />
              <div>
                <h1>Zinra</h1>
                <p class="eyebrow">Studio</p>
              </div>
            </div>
            <div class="popup-head-actions">
              <button class="btn pro-cta" type="button">Get Pro</button>
              <span class="hud-chip idle">Ready</span>
            </div>
          </header>

          <section class="card">
            <label class="check">
              <input type="checkbox" checked />
              <span class="check-copy">
                <img class="ui-icon" src="../../icons/svg/auto-zoom.svg" alt="" />
                Mark a zoom on each click
              </span>
            </label>
            <label class="field">
              <span>Zoom depth <em>1.50×</em></span>
              <input type="range" min="1.2" max="2.6" step="0.05" value="1.5" />
            </label>
            <label class="field">
              <span>Zoom length <em>2.2s</em></span>
              <input type="range" min="0.8" max="4" step="0.1" value="2.2" />
            </label>
            <label class="check">
              <input type="checkbox" checked />
              <span class="check-copy">
                <img class="ui-icon" src="../../icons/svg/mic.svg" alt="" />
                Include tab audio
              </span>
            </label>
            <label class="check">
              <input type="checkbox" />
              <span class="check-copy">
                <img class="ui-icon" src="../../icons/svg/camera.svg" alt="" />
                Include camera
              </span>
            </label>
            <label class="field">
              <span>
                <span class="check-copy">
                  <img class="ui-icon" src="../../icons/svg/settings.svg" alt="" />
                  Export quality
                </span>
              </span>
              <select>
                <option selected>1080p</option>
              </select>
            </label>
          </section>

          <div class="actions">
            <button class="btn primary record-cta" type="button">
              <img class="ui-icon" src="../../icons/svg/record.svg" alt="" />
              <span class="btn-label">Record this page</span>
            </button>
            <button class="btn ghost record-cta" type="button">
              <img class="ui-icon" src="../../icons/svg/share.svg" alt="" />
              <span class="btn-label">Record my screen</span>
            </button>
          </div>
          <p class="fine pro-note">2 free exports. 4K, 60fps, and extra click effects are Pro.</p>
        </div>
      </aside>
    </div>
  </div>
  <script>document.documentElement.dataset.shotReady = "1"; window.__SHOT_READY__ = true;</script>
</body>
</html>
